schema_version: "1.0"
kind: company_brain_source_registry

defaults:
  raw_retention_days: 14
  approval_required: true
  auto_promote_allowed: false
  personal_connectors_are_company_sources: false

sources:
  - id: company-brain-root
    connector: filesystem
    display_name: Company Brain Root
    control_tier: company_owned
    status: active
    credential_ref: manual:none
    owner: brain-owner
    review_owner: brain-owner
    capture:
      allowed: true
      mode: mounted_folder
      approval_required: false
      raw_retention_days: 0
    scope:
      include:
        - curated markdown brain notes
        - approved source documents
      exclude:
        - credentials
        - private personal material
    raw_policy:
      store_raw: false
      retention_days: 0
    routing:
      default_destination: "."
      staging_destination: system/staging
      restricted_prefixes:
        - brain/restricted
    artifact_policy:
      allowed:
        - curated_note
        - source_reference
      not_allowed:
        - credential_value
    dedupe:
      external_id_field: path
      strategy: path
    sync:
      enabled: false
      cursor: null
      last_successful_pull: null
    audit:
      last_reviewed: null
      approved_by: brain-owner

  - id: company-add-to-brain-drop-zone
    connector: filesystem
    display_name: Manual team contribution drop zone
    control_tier: company_owned
    status: active
    credential_ref: manual:none
    owner: brain-owner
    review_owner: brain-owner
    capture:
      allowed: true
      mode: mounted_folder
      approval_required: false
      raw_retention_days: 0
    scope:
      include:
        - low-risk manual team contributions under ADD_TO_BRAIN
      exclude:
        - credentials
        - personal/private material
        - HR/legal/finance unless reviewed
        - broad connector exports
    raw_policy:
      store_raw: false
      retention_days: 0
    routing:
      default_destination: brain/sources
      staging_destination: system/staging
      restricted_prefixes:
        - brain/restricted
    artifact_policy:
      allowed:
        - curated_note
        - source_reference
        - reusable_fact
      not_allowed:
        - credential_value
        - raw_export_by_default
        - personal_message
    dedupe:
      external_id_field: path
      strategy: path_plus_hash
    sync:
      enabled: true
      cursor: null
      last_successful_pull: null
    audit:
      last_reviewed: null
      approved_by: brain-owner

  - id: company-fireflies
    connector: fireflies
    display_name: Company Fireflies Workspace
    control_tier: company_owned
    status: proposed
    credential_ref: env:COMPANY_FIREFLIES_API_KEY
    owner: brain-owner
    review_owner: brain-owner
    capture:
      allowed: false
      mode: scheduled
      approval_required: true
      raw_retention_days: 14
    scope:
      include:
        - meetings with company participants
        - meetings tagged company-brain
      exclude:
        - personal meetings
        - HR/compensation/legal unless explicitly restricted
    raw_policy:
      store_raw: private_only
      retention_days: 14
    routing:
      default_destination: brain/intelligence/meetings
      staging_destination: system/staging
      restricted_prefixes:
        - brain/restricted
    artifact_policy:
      allowed:
        - curated_summary
        - decisions
        - action_items
        - reusable_facts
        - provenance_link
      not_allowed:
        - raw_transcript_by_default
        - credential_value
    dedupe:
      external_id_field: meeting_id
      strategy: source_id_plus_external_id
    sync:
      enabled: false
      cursor: null
      last_successful_pull: null
    audit:
      last_reviewed: null
      approved_by: null

  - id: company-confluence-public-spaces
    connector: confluence
    display_name: Company Confluence Public Spaces
    control_tier: company_owned
    status: proposed
    credential_ref: env:COMPANY_CONFLUENCE_TOKEN
    owner: brain-owner
    review_owner: brain-owner
    capture:
      allowed: false
      mode: scheduled
      approval_required: true
      raw_retention_days: 14
    scope:
      include:
        - company spaces approved for brain use
        - published pages with company-wide visibility
      exclude:
        - user spaces
        - restricted spaces
        - drafts
        - HR/legal/finance unless routed restricted
    raw_policy:
      store_raw: private_only
      retention_days: 14
    routing:
      default_destination: brain/sources/confluence
      staging_destination: system/staging
      restricted_prefixes:
        - brain/restricted
    artifact_policy:
      allowed:
        - canonical_summary
        - sop_update
        - decision
        - source_reference
      not_allowed:
        - raw_page_dump
        - credential_value
    dedupe:
      external_id_field: page_id
      strategy: source_id_plus_external_id
    sync:
      enabled: false
      cursor: null
      last_successful_pull: null
    audit:
      last_reviewed: null
      approved_by: null

  - id: delegated-email-client-example
    connector: email
    display_name: Delegated client-scoped email example
    control_tier: delegated_personal
    status: proposed
    credential_ref: keychain:delegated-client-email
    owner: account-owner
    review_owner: account-owner
    capture:
      allowed: false
      mode: scheduled
      approval_required: true
      raw_retention_days: 7
    scope:
      include:
        - client:example-client
        - label:company-brain
        - from_domain:example-client.com
      exclude:
        - personal
        - family
        - HR
        - legal
        - finance
    raw_policy:
      store_raw: private_only
      retention_days: 7
    routing:
      default_destination: brain/customers/accounts
      staging_destination: system/staging
      restricted_prefixes:
        - brain/restricted
    artifact_policy:
      allowed:
        - customer_fact
        - commitment
        - action_item
        - account_update
      not_allowed:
        - raw_email
        - private_message
        - credential_value
    dedupe:
      external_id_field: thread_id
      strategy: source_id_plus_external_id
    sync:
      enabled: false
      cursor: null
      last_successful_pull: null
    audit:
      last_reviewed: null
      approved_by: null

  - id: company-shared-apollo
    connector: apollo
    display_name: Company Shared Apollo Workspace
    control_tier: company_owned
    status: proposed
    credential_ref: env:COMPANY_APOLLO_API_KEY
    owner: brain-owner
    review_owner: brain-owner
    capture:
      allowed: false
      mode: scheduled
      approval_required: true
      raw_retention_days: 14
    scope:
      include:
        - company-approved accounts and contacts
        - GTM notes approved for team reuse
      exclude:
        - personal prospecting lists
        - private teammate notes
        - credentials and billing data
    raw_policy:
      store_raw: private_only
      retention_days: 14
    routing:
      default_destination: brain/go-to-market/accounts
      staging_destination: system/staging
      restricted_prefixes:
        - brain/restricted
    artifact_policy:
      allowed:
        - account_summary
        - customer_fact
        - reusable_gtm_note
      not_allowed:
        - raw_export_by_default
        - credential_value
    dedupe:
      external_id_field: apollo_id
      strategy: source_id_plus_external_id
    sync:
      enabled: false
      cursor: null
      last_successful_pull: null
    audit:
      last_reviewed: null
      approved_by: null

  - id: personal-fireflies-example
    connector: fireflies
    display_name: Personal Fireflies Account Example
    control_tier: personal_private
    status: excluded
    credential_ref: none
    owner: individual
    review_owner: brain-owner
    capture:
      allowed: false
      mode: none
      approval_required: true
      raw_retention_days: 0
    scope:
      include: []
      exclude:
        - all scheduled company-brain capture
    raw_policy:
      store_raw: false
      retention_days: 0
    routing:
      default_destination: null
      staging_destination: system/staging
      restricted_prefixes:
        - brain/restricted
    artifact_policy:
      allowed: []
      not_allowed:
        - raw_transcript
        - meeting_summary
    dedupe:
      external_id_field: null
      strategy: none
    sync:
      enabled: false
      cursor: null
      last_successful_pull: null
    audit:
      last_reviewed: null
      approved_by: null
